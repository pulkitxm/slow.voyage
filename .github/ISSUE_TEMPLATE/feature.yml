name: Feature request
description: Propose an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What is missing or difficult in the drive today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Explain the desired driving, visual, or interface behavior, including
        keyboard, touch, and controller input.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
